<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocab Player">
<meta name="robots" content="noindex, nofollow">
<title>Vocab Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Vocab Player</a>
  <nav class="nav" id="nav">
    <a href="#/" data-nav="home">영상</a>
    <a href="#/books" data-nav="books">책</a>
    <a href="#/review" data-nav="review">복습<span class="nb" id="rvBadge" hidden></span></a>
    <a href="#/words" data-nav="words">단어장</a>
    <a href="#/cards" data-nav="practice">연습</a>
  </nav>
</header>
<div id="note" class="note-bar" hidden></div>
<main id="view" class="view"><p class="empty">불러오는 중…</p></main>
<div id="sheet" class="sheet" hidden></div>
<div id="gate" class="gate" hidden>
  <form class="gate-box" id="gateForm">
    <h1>Vocab Player</h1>
    <p>처음 한 번만 비밀번호를 넣어 주세요. 이 기기에 기억해 둘게요.</p>
    <input id="gatePass" type="password" autocomplete="current-password" placeholder="비밀번호">
    <div class="err" id="gateErr"></div>
    <button class="btn primary" type="submit">들어가기</button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
